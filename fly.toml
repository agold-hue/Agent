# Fly.io: one machine that never sleeps, a volume for browser profiles and files.
#   fly launch --no-deploy   (accept this file)
#   fly volumes create workmate_data --size 10
#   fly secrets set DATABASE_URL=... ANTHROPIC_API_KEY=... MASTER_KEY=... SESSION_SECRET=... SMTP_HOST=... SMTP_USER=... SMTP_PASS=... MAIL_FROM=...
#   fly deploy
app = "workmate"
primary_region = "ewr"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  APP_URL = "https://workmate.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[mounts]
  source = "workmate_data"
  destination = "/data"
